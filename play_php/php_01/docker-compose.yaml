version: "3.9"

services:
  # ---------------------------
  # PHP-FPM (runs PHP code)
  # ---------------------------
  php-app:
    image: azyraz/imazy-php-base:8.2
    container_name: php-app
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
    networks: [student-net]
    depends_on:
      - mariadb
      - student-grpc

  # ---------------------------
  # Nginx (reverse proxy → php-app)
  # ---------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./app:/var/www/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on: [php-app]
    networks: [student-net]

  # ---------------------------
  # MariaDB (database)
  # ---------------------------
  mariadb:
    image: mysql:8.0
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: student
      MYSQL_USER: student_user
      MYSQL_PASSWORD: student_pass
    ports:
      - "3307:3306"                      # mapped to host:3307
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./app/student.sql:/docker-entrypoint-initdb.d/student.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-hmariadb", "-ustudent_user", "-pstudent_pass"]
      interval: 5s
      retries: 10
    networks:
      - student-net

  # ---------------------------
  # gRPC Python microservice
  # ---------------------------
  student-grpc:
    image: azyraz/py-base:3.11
    container_name: student-grpc
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -lc "pip install --no-cache-dir
      'protobuf>=5.26.1,<6'
      'grpcio==1.65.1'
      'grpcio-tools==1.65.1'
      && python student_service.py"
    
    environment:
      DB_HOST: mariadb
      DB_NAME: student
      DB_USER: student_user
      DB_PASSWORD: student_pass
      DB_PORT: '3306'
    ports:
      - "50051:50051"
    depends_on:
      mariadb:
        condition: service_healthy
    networks: [student-net]
# ---------------------------
# Networks & Volumes
# ---------------------------
networks:
  student-net:
    driver: bridge

volumes:
  mariadb-data:

