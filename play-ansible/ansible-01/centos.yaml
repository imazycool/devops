---
- name: configure centos servers 
  hosts: centos 
  become: true 
  tasks: 
    - name: install nginx 
      yum:
        name: nginx
        state: present

    - name: install httpd
      yum: 
        name: httpd
        state: present 

    - name: start httpd 
      service: 
        name: httpd 
        state: started 

    - name: stop httpd 
      service: 
        name: httpd
        state: stopped 

    - name: start nginx 
      service: 
        name: nginx 
        state: started 

    - name: stop nginx 
      service: 
        service: 
          name: nginx 
          state: stopped 

    - name: uninstall nginx 
      yum: 
        name: nginx 
        state: absent 
      
    - name: uninstall httpd 
      yum: 
        name: httpd 
        state: absent 